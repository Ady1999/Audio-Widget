<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Widget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel" id="panel">
      <header class="bar" data-tauri-drag-region>
        <span class="bar-title" data-tauri-drag-region>Audio <span class="version" id="version" data-tauri-drag-region></span></span>
        <button class="icon-btn small" id="pin" aria-pressed="false" title="Pin on top of other windows">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 3l6 6-2 1-3 3 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 3-3z"/></svg>
        </button>
        <button class="icon-btn small" id="hide" title="Hide to tray (Ctrl+Alt+A brings it back)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>
        </button>
      </header>
      <section class="card" id="output-card">
        <header class="card-head">
          <h2>Sound Output</h2>
          <span class="hint" id="mirror-hint" hidden></span>
        </header>
        <div class="slider-row">
          <button class="icon-btn" id="output-mute" title="Mute"></button>
          <input type="range" class="slider" id="output-volume" min="0" max="100" step="1" />
        </div>
        <ul class="device-list" id="output-list"></ul>
      </section>

      <section class="card" id="input-card">
        <header class="card-head">
          <h2>Sound Input</h2>
        </header>
        <div class="slider-row">
          <button class="icon-btn" id="input-mute" title="Mute"></button>
          <input type="range" class="slider" id="input-volume" min="0" max="100" step="1" />
        </div>
        <ul class="device-list" id="input-list"></ul>
      </section>

      <footer class="footer">
        <button class="link" id="open-settings">Sound Settings…</button>
        <label class="mini-toggle" title="Start Audio Widget when you sign in">
          <span>Launch at login</span>
          <input type="checkbox" id="autostart" />
          <span class="switch"></span>
        </label>
      </footer>

      <p class="error" id="error" hidden></p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
