name: Build (Windows)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Build installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: audio-widget-windows
          path: |
            src-tauri/target/release/audio-widget.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Every push becomes a GitHub Release, so the newest version shows in the repo sidebar.
      - name: Publish release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          cp src-tauri/target/release/audio-widget.exe "audio-widget-${version}-portable.exe"
          gh release create "$tag" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            "audio-widget-${version}-portable.exe" \
            --target "$GITHUB_SHA" \
            --title "Audio Widget ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "$(git log -1 --format=%B "$GITHUB_SHA" | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:')" \
            --latest
